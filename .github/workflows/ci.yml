name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: every run (PR and push) executes with a token that can only
# read. No step in this workflow needs write access.
permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN in .git/config for the steps that run
          # PR-controlled code (npm ci lifecycle scripts, smokes, build).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tier-1 smoke tests
        run: npm run test:tier1

      - name: Build
        run: npm run build
